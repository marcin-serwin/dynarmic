name: x86-64

on: [ push, pull_request ]

env:
  BUILD_TYPE: Release

jobs:
  build:
    strategy:
      matrix:
        os: [ windows-latest, ubuntu-latest, macos-latest ]
        cpu_detection: [ 0, 1 ]
      fail-fast: false

    runs-on: ${{matrix.os}}

    steps:

      - name: Install build dependencies
        if: ${{matrix.os == 'ubuntu-latest'}}
        run: sudo apt-get install llvm ninja-build libboost-all-dev catch2

      - name: Install build dependencies
        if: ${{matrix.os == 'macos-latest'}}
        run: |
          brew install llvm ninja
          echo "/usr/local/opt/llvm/bin" >> $GITHUB_PATH

      - name: Checkout dynarmic repo
        uses: actions/checkout@v2

      - name: Configure CMake
        if: ${{matrix.os == 'ubuntu-latest'}}
        env:
          CC: gcc-10
          CXX: g++-10
          CXXFLAGS: -Wp,-D_GLIBCXX_ASSERTIONS
        run: >
          cmake
          -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DDYNARMIC_ENABLE_CPU_FEATURE_DETECTION=${{matrix.cpu_detection}}
          -DDYNARMIC_USE_LLVM=1
          -G Ninja

      - name: Configure CMake
        if: ${{matrix.os == 'macos-latest'}}
        run: >
          cmake
          -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DDYNARMIC_ENABLE_CPU_FEATURE_DETECTION=${{matrix.cpu_detection}}
          -DDYNARMIC_TESTS_USE_UNICORN=1
          -DDYNARMIC_USE_LLVM=1
          -G Ninja

      - name: Configure CMake
        if: ${{matrix.os == 'windows-latest'}}
        run: >
          cmake
          -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
          -DDYNARMIC_ENABLE_CPU_FEATURE_DETECTION=${{matrix.cpu_detection}}
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build
        working-directory: ${{github.workspace}}/build
        run: cmake --build . --config Release

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest --extra-verbose -C ${{env.BUILD_TYPE}}
